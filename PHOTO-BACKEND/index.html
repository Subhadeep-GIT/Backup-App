<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Backup</title>
  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <!-- Container -->
  <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Upload Photos for Backup</h1>
    
    <!-- Upload Form -->
    <form id="uploadForm" enctype="multipart/form-data" class="space-y-6">
      <div class="flex flex-col items-center">
        <label class="block w-full">
          <input id="fileInput" type="file" name="photo" accept="image/*" multiple required class="block w-full text-sm text-gray-500
          file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold
          file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </label>
      </div>
      
      <!-- Progress Bar -->
      <div id="progressContainer" class="w-full bg-gray-200 rounded-full h-4 mb-4 hidden">
        <div id="progressBar" class="bg-blue-600 h-4 rounded-full" style="width: 0%;"></div>
      </div>
      <div id="progressText" class="text-center text-gray-700 hidden">0%</div>

      <div class="text-center">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          Upload Photos
        </button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent the default form submission

      const form = event.target;
      const formData = new FormData(form);
      const fileInput = document.getElementById('fileInput');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload', true);

      // Show the progress bar and text
      document.getElementById('progressContainer').classList.remove('hidden');
      document.getElementById('progressText').classList.remove('hidden');

      // Track upload progress
      xhr.upload.onprogress = function(event) {
        if (event.lengthComputable) {
          const percentComplete = Math.round((event.loaded / event.total) * 100);
          document.getElementById('progressBar').style.width = percentComplete + '%';
          document.getElementById('progressText').innerText = percentComplete + '%';
        }
      };

      // Handle response
      xhr.onload = function() {
        if (xhr.status === 200) {
          alert('Files uploaded successfully!');
          // Deselect the files
          fileInput.value = '';
        } else {
          alert('Error uploading files');
        }
        // Reset progress bar and text
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').innerText = '0%';
        document.getElementById('progressContainer').classList.add('hidden');
        document.getElementById('progressText').classList.add('hidden');
      };

      // Send the form data
      xhr.send(formData);
    });
  </script>
</body>
</html>
